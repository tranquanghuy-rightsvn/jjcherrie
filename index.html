<!-- Warms up the subpages in the background so the *first* real click already
     has the destination cached — cross-document view transitions tend to get
     silently skipped on a cold/first navigation to a page, but work
     consistently once it's been fetched once. Pure HTML, no JS. -->
<link rel="prefetch" href="about/" />
<link rel="prefetch" href="contact/" />
<link rel="prefetch" href="work/" />
<!-- Speculation Rules: a declarative JSON hint (no imperative JS logic) that
     tells Chrome to fully render the nav target in the background the moment
     the pointer hovers/presses on it — a beat before the real click lands.
     This is what actually makes the button "fly" transition reliable; plain
     prefetch above only warms the HTTP cache, which isn't always enough for
     the browser to have the destination ready in time to run the
     transition. Scoped to hover (not "eager") so it doesn't prerender all
     three pages at once on every load. Unsupported browsers just ignore this
     block entirely (nothing breaks, no cost). -->
<script type="speculationrules">
{
  "prerender": [
    {
      "where": { "href_matches": "/*" },
      "eagerness": "moderate"
    }
  ]
}
</script>
</head>
